{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ title }} | PICKCAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/cameroon.css' %}">
    <link rel="stylesheet" href="{% static 'css/brand-logo.css' %}">
  </head>
  <body>
    <main class="min-vh-100 d-grid align-items-center p-4">
      <section class="contact-form text-center mx-auto" style="max-width:500px">
        <a class="navbar-brand mb-4" href="{% url 'home' %}">
          <span class="brand-mark"><i class="bi bi-recycle"></i></span><span class="brand-word">PICKCAM</span>
        </a>
        <h1 style="font-size:2rem">{{ title }}</h1>
        <p>{{ description }}</p>
        {% if page == 'company' %}
          <a class="btn btn-primary" href="{% url 'home' %}#contact">Contact PICKCAM</a>
        {% else %}
          <a class="btn btn-primary" href="{% url 'home' %}">Return home</a>
        {% endif %}
      </section>
    </main>
  </body>
</html>
